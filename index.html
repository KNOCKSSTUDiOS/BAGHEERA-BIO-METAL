<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELA ALPHA STUDiO</title>
    <style>
        :root {
            --void: #020208;
            --cyan: #00ffe6;
            --magenta: #ff00b4;
            --emerald: #00d278;
            --ember: #ff5a00;
            --peach: #ffb48c;
            --flamingo: #fc8eac;
            --white: #ffffff;
        }
        body {
            background-color: var(--void);
            color: var(--white);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            gap: 15px;
            overflow: hidden;
        }
        .brutalist-panel {
            border: 3px solid var(--cyan);
            box-shadow: 8px 8px 0px rgba(0, 255, 230, 0.15);
            background: rgba(15, 15, 20, 0.85);
            padding: 15px;
            box-sizing: border-box;
        }
        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-color: var(--cyan);
        }
        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cyan);
        }
        .system-stats {
            font-size: 12px;
            color: var(--emerald);
        }
        /* Main Workspace Layout */
        main {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 15px;
            overflow: hidden;
        }
        .sidebar {
            border-color: var(--flamingo);
            box-shadow: 8px 8px 0px rgba(252, 142, 172, 0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* 4K Grid Viewport Canvas */
        .viewport {
            border-color: var(--peach);
            box-shadow: 8px 8px 0px rgba(255, 180, 140, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000000;
        }
        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(100, 100, 100, 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(100, 100, 100, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .viewport-tag {
            font-size: 14px;
            font-weight: bold;
            color: var(--peach);
            letter-spacing: 3px;
        }
        /* Right Side Prompt Ingest */
        .inspector {
            border-color: var(--magenta);
            box-shadow: 8px 8px 0px rgba(255, 0, 180, 0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            border: 2px solid var(--magenta);
            color: var(--flamingo);
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
        }
        /* Real Action Buttons */
        .btn {
            width: 100%;
            background: var(--magenta);
            color: var(--void);
            border: 3px solid var(--white);
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--white);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--white);
        }
        /* Bottom Cinematic Timeline */
        footer {
            border-color: var(--ember);
            box-shadow: 8px 8px 0px rgba(255, 90, 0, 0.15);
        }
        .track {
            height: 35px;
            background: rgba(0, 255, 230, 0.05);
            border: 1px solid var(--peach);
            margin: 5px 0;
            display: flex;
            align-items: center;
            padding-left: 15px;
            font-size: 12px;
            color: var(--peach);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. Top Navigation Bar -->
    <header class="brutalist-panel">
        <h1>⚡ VELA ALPHA STUDiO</h1>
        <div class="system-stats">GPU: 54°C | VRAM: 11.5GB | NATIVE_VULKAN</div>
    </header>

    <!-- 2. Main Workspace Layout -->
    <main>
        <!-- Left Sidebar: Asset Library -->
        <div class="brutalist-panel sidebar">
            <h3>📁 ASSET_STAGING</h3>
            <div style="font-size: 12px; line-height: 1.8;">
                • 🎥 scene_01_plates.mp4<br>
                • 🎥 scene_02_fabrication.mp4<br>
                • 🔊 atmos_7.1_master.wav
            </div>
        </div>

        <!-- Center: WebGL 4K Target Canvas -->
        <div class="brutalist-panel viewport">
            <div class="grid-lines"></div>
            <div class="viewport-tag">4K_ULTRA_HDR_MASTER</div>
        </div>

        <!-- Right: Prompt Engine & Inspector -->
        <div class="brutalist-panel inspector">
            <h3>📝 DIRECTIVE_INPUT</h3>
            <textarea placeholder="Type your AI prompt here..."></textarea>
            <button class="btn">IGNITE PIPELINE</button>
        </div>
    </main>

    <!-- 3. Bottom Cinematic Timeline -->
    <footer class="brutalist-panel">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: bold;">
            <span>CINEMATIC_TIMELINE</span>
            <span>TC: 00:00:24:00</span>
        </div>
        <div class="track">VIDEO_01</div>
        <div class="track">VFX_01</div>
        <div class="track">AUDIO_01</div>
    </footer>

</body>
</html>
